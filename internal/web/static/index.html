<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valinor Web</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">Sessions</div>
        <div id="sessions" class="sessions"></div>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <span>Valinor Web</span>
          <div class="model-selector">
            <select id="provider-select" title="Provider"></select>
            <select id="model-select" title="Model"></select>
          </div>
          <span id="status" class="status">connecting...</span>
        </header>

        <section id="messages" class="messages"></section>

        <form id="composer" class="composer">
          <input id="input" type="text" placeholder="Send a message..." autocomplete="off" />
          <button type="submit">Send</button>
          <button id="new-conversation" type="button">New</button>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
  </html>
