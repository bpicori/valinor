# Example Valinor configuration file
# Default instance: copy this to ~/.valinor/config.toml.
# Named instance: copy to ~/.valinor/instances/<name>/config.toml and set
# valinor_dir to the same instance root.
#
# Root keys must stay before the first [table].

default_provider = "openai"

# Gateway configuration for WebSocket clients and Telegram.
gateway_enabled = true
gateway_host = "127.0.0.1"
gateway_port = 7778
gateway_path = "/ws"

# Instance data directory (sessions, workspace, cron, logs).
valinor_dir = "~/.valinor"

# Agent configuration
max_agent_iterations = 20

# Provider configurations
[providers.openai]
type = "openai"
api_key = "sk-..."
default_model = "gpt-4o"
# transcription_enabled = true
# transcription_model = "whisper-1"

[providers.anthropic]
type = "anthropic"
api_key = "sk-ant-..."
default_model = "claude-3-5-sonnet-20241022"

[providers.gemini]
type = "gemini"
api_key = "..."
default_model = "gemini-2.0-flash"

# OpenRouter example with voice transcription for Telegram:
# [providers.openrouter]
# type = "openai-compatible"
# api_key = "sk-or-..."
# base_url = "https://openrouter.ai/api/v1"
# default_model = "deepseek/deepseek-v4-pro"
# transcription_enabled = true
# transcription_model = "openai/whisper-1"

# DeepSeek example. Thinking is optional at the API level; set it explicitly
# when you want reasoning content.
# [providers.deepseek]
# type = "openai-compatible"
# api_key = "sk-..."
# base_url = "https://api.deepseek.com"
# default_model = "deepseek-flash"
# thinking = "enabled"

# Web search + fetch tools (web_search / web_fetch)
# [search]
# provider = "deepseek"   # "" disables both tools; supported: deepseek
# api_key = ""            # defaults to providers.deepseek.api_key
# base_url = ""           # defaults to https://api.deepseek.com
# max_results = 10        # default results per search (1-50)

# Image generation (generate_image tool), independent of the chat provider.
# Uses OpenRouter's Image API: POST {base_url}/images.
# [image_generation]
# provider = "openrouter"                    # "" disables the tool; supported: openrouter
# api_key = "sk-or-..."                      # OpenRouter key with image-model access
# base_url = "https://openrouter.ai/api/v1"  # optional; default shown
# model = "bytedance-seed/seedream-5-0-flash"  # Seedream 5.0 Flash (1K/2K, ~$0.018/image)

# Context compression (triggers at 85% of 200K window)
# [context]
# preserve_recent_messages = 20  # messages kept verbatim at the tail
# window_tokens = 200000         # model context window used for compression thresholds
# max_output_tokens = 8192       # raise to 65536 for DeepSeek thinking mode

# Telegram Bot configuration
# enabled defaults to true; the setup wizard asks for the token and allowed user IDs.
# [telegram]
# bot_token = "YOUR_BOT_TOKEN_FROM_BOTFATHER"
# allowed_user_ids = [123456789] # numeric IDs; DM @userinfobot. Empty denies everyone.
# allowed_chat_ids = []          # optional group/supergroup IDs; empty denies groups
# poll_timeout = 30              # optional; long-polling timeout (seconds, max 90)
# retry_base_delay = 1           # optional; base retry delay (seconds)
# retry_max_delay = 30           # optional; maximum retry delay (seconds)
# require_mention = true         # optional; require @bot mention on text in groups (files are kept for the next instruction)

# Scheduled jobs (enabled by default)
# The agent manages jobs via the cronjob tool (action=add|list|remove|history|pause|resume|run|edit).
# Jobs are persisted to ~/.valinor/cron/jobs.json and run in isolated sessions.
# no_agent scripts live in <workspace>/scripts/ (writable via write_file).
# [scheduler]
# script_timeout = "120s"        # optional; max runtime for no_agent scripts
# scripts_dir = "/custom/path"   # optional override; default is workspace/scripts

# Offline memory consolidation ("dreaming", opt-in)
# When enabled, Valinor periodically consolidates recent conversations into
# MEMORY.md for a more continuous, personal experience. Runs happen while the
# instance is idle and are not configurable beyond on/off. Reports are written
# to <workspace>/memory/dreams/.
# [dreaming]
# enabled = true