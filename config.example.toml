# Example Valinor configuration file
# Copy this to config.toml and fill in your provider details

# Default provider to use for new sessions
default_provider = "openai"

# Provider configurations
[providers.openai]
type = "openai"
api_key = "sk-..."
default_model = "gpt-4o"

[providers.anthropic]
type = "anthropic"
api_key = "sk-ant-..."
default_model = "claude-3-5-sonnet-20241022"

[providers.gemini]
type = "gemini"
api_key = "..."
default_model = "gemini-2.0-flash"

# Web server configuration (for future web UI)
web_enabled = true
web_host = "127.0.0.1"
web_port = 7777

# Gateway configuration for WebSocket client connections
# This is how TUI and other clients connect to the session core
gateway_enabled = true
gateway_host = "127.0.0.1"
gateway_port = 7778
gateway_path = "/ws"

# Directories (optional - defaults to ~/.valinor/)
# valinor_dir = "~/.valinor"
# session_dir = "~/.valinor/sessions"
# workspace_dir = "~/.valinor/workspace"

# Agent configuration
max_agent_iterations = 20
